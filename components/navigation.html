            <script defer="" data-name="navigation-logic">
              document.addEventListener('DOMContentLoaded', function() {
                (function(){
                  const nav = document.getElementById("main-nav")
                  const overlay = document.getElementById("mobile-overlay")
                  const openBtn = document.getElementById("mobile-menu-open")
                  const closeBtn = document.getElementById("mobile-menu-close")
                  let lastScroll = 0

                  const toggleMenu = (isOpen) => {
                    overlay.classList.toggle("is-active", isOpen)
                    openBtn.setAttribute("aria-expanded", isOpen)
                    overlay.setAttribute("aria-hidden", !isOpen)
                    document.body.style.overflow = isOpen ? "hidden" : ""
                  }

                  openBtn.addEventListener("click", () => toggleMenu(true))
                  closeBtn.addEventListener("click", () => toggleMenu(false))

                  window.addEventListener("keydown", (e) => {
                    if (e.key === "Escape" && overlay.classList.contains("is-active")) {
                      toggleMenu(false)
                    }
                  })

                  window.addEventListener("scroll", () => {
                    const currentScroll = window.pageYOffset

                    if (currentScroll <= 0) {
                      nav.style.transform = "translateY(0)"
                      return
                    }

                    if (currentScroll > lastScroll && !overlay.classList.contains("is-active")) {
                      nav.style.transform = "translateY(-100%)"
                    } else {
                      nav.style.transform = "translateY(0)"
                    }

                    lastScroll = currentScroll
                  })

                  overlay.querySelectorAll(".navigation-mobile-link").forEach((link) => {
                    link.addEventListener("click", () => toggleMenu(false))
                  })
                })()
              });
            </script>
          </div>
        </div>
